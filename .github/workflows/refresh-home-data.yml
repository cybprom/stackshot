# Opens a PR with a refreshed lib/home-data.json, monthly.
#
# ADR-0035 kept GitHub out of the build on purpose, so the homepage's data is only as
# fresh as the last time someone ran the script. `scripts/check-home.ts` warns past 30
# days, but a warning in a build log is a prompt nobody is reading in six months. This is
# the mechanism that ADR named as the answer if that happened, arriving early: a PR email
# is a thing the author will see.
#
# **It opens a PR and never pushes to main.** A refreshed stack changes the first thing
# every visitor sees, and the layer summaries are in the PR body to be read before
# merging — a card that has decayed into noise is a judgement call no test makes.
#
# No third-party action: `gh` and `git` are already on the runner, and this job needs
# write access, which is not a permission to hand to a dependency for convenience.
name: Refresh homepage data

on:
  schedule:
    # 06:00 UTC on the 1st. Monthly against a 30-day warning, so the PR lands before the
    # build starts complaining rather than after.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-home-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve the homepage's repos
        env:
          # The job's own token is enough: the script reads public repos only, and this
          # token is scoped to this repository and expires with the run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm tsx scripts/prepare-home.ts | tee /tmp/summary.txt

      - name: Check the refreshed file the way the build does
        run: pnpm tsx scripts/check-home.ts

      # The schema and the six-tile floor both live here, so a repo that has decayed into
      # a near-blank card fails the job rather than drifting onto the wall.
      - run: pnpm test

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- lib/home-data.json; then
            echo "No change: every repo resolves to the stack already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One rolling branch, force-pushed: a month where something changed updates the
          # open PR rather than opening a second one beside it.
          git checkout -B refresh-home-data
          git add lib/home-data.json
          git commit -m "Refresh the homepage's stack data

          Regenerated by .github/workflows/refresh-home-data.yml. Read the layer summaries
          in the PR body before merging: a repo whose stack has decayed into a near-blank
          card belongs off the wall, and no test can tell you which one that is."
          git push --force origin refresh-home-data

          {
            echo "Regenerated \`lib/home-data.json\` with \`scripts/prepare-home.ts\`."
            echo
            echo "**Read the summaries before merging.** A repo can change what it uses, and a card"
            echo "that has become noise is a judgement call the suite cannot make — the only"
            echo "automated floor is six tiles."
            echo
            echo '```'
            cat /tmp/summary.txt
            echo '```'
          } > /tmp/body.md

          if gh pr view refresh-home-data --json number >/dev/null 2>&1; then
            gh pr edit refresh-home-data --body-file /tmp/body.md
          else
            gh pr create \
              --base main \
              --head refresh-home-data \
              --title "Refresh the homepage's stack data" \
              --body-file /tmp/body.md
          fi
