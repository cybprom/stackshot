<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction D: terminal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;background:#E6E8E3}
</style>
</helmet>
<div style="width: 2040px; height: 900px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 40px; background: #E6E8E3">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
<div style="padding: 40px; background: {{s.bg}}; border-radius: 4px; display: flex; gap: 40px; align-items: flex-start">
<sc-for list="{{s.cards}}" as="c" hint-placeholder-count="3">
<div style="width: 600px; flex-shrink: 0; box-sizing: border-box; background: {{c.term}}; border: 1px solid {{c.rule}}; border-radius: 8px; padding: 16px 20px 14px; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<div style="font-size: 12px; color: {{c.muted}}"><span style="color: {{c.accent}}; font-weight: 600">$</span> stackshot {{c.owner}}/{{c.repo}}</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px">
<span style="font-weight: 700; font-size: 18px; color: {{c.ink}}; min-width: 0">{{c.owner}}/{{c.repo}}</span>
<span style="display: flex; gap: 14px; font-size: 12px; color: {{c.muted}}; white-space: nowrap">
<sc-if value="{{c.hasLang}}" hint-placeholder-val="{{ true }}"><span>{{c.lang}}</span></sc-if>
<span>{{c.stars}}</span>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{c.layers}}" as="l" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: flex-start">
<div style="width: 122px; flex-shrink: 0; font-size: 13.5px; line-height: 19px; white-space: nowrap"><span style="color: {{l.muted}}">{{l.glyph}}</span> <span style="font-weight: 600; color: {{l.color}}">{{l.key}}</span></div>
<div style="display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 2px; min-width: 0; font-size: 13.5px; line-height: 19px">
<sc-for list="{{l.items}}" as="it" hint-placeholder-count="3">
<span style="color: {{it.ink}}; white-space: nowrap">{{it.n}}<sc-if value="{{it.hasV}}" hint-placeholder-val="{{ true }}"><span style="color: {{it.muted}}; margin-left: 6px">{{it.v}}</span></sc-if></span>
</sc-for>
<sc-if value="{{l.hasMore}}" hint-placeholder-val="{{ false }}"><span style="color: {{l.muted}}; white-space: nowrap">{{l.more}}</span></sc-if>
</div>
</div>
</sc-for>
</div>
<div style="font-size: 11px; color: {{c.muted}}">stackshot.ilerioluwa.com</div>
</div>
</sc-for>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2040,"height":900}}'>
const REPOS = [
  { owner: 'vercel', repo: 'next.js', lang: 'JavaScript', stars: '142k stars', layers: [
    { k: 'frontend', name: 'Frontend', more: 0, items: [['Next.js', '16', 'Nx'], ['Radix UI', '', 'Rx'], ['SWR', '2', 'Sw'], ['Lucide', '', 'Lu'], ['Tailwind', '4', 'Tw'], ['Sass', '1', 'Sa']] },
    { k: 'backend', name: 'Backend', more: 1, items: [['Node', '20', 'No'], ['Tokio', '1', 'Tk'], ['napi-rs', '3', 'Na'], ['clap', '4', 'Cl'], ['Rust', '', 'Rs'], ['Serde', '1', 'Sd']] },
    { k: 'infra', name: 'Infra', more: 0, items: [['Vercel', '', 'Vc'], ['GitHub Actions', '', 'Ga']] },
    { k: 'tooling', name: 'Tooling', more: 7, items: [['Turborepo', '2', 'Tb'], ['pnpm workspaces', '', 'Pn'], ['Lerna', '9', 'Le'], ['Jest', '29', 'Je'], ['Playwright', '1', 'Pl'], ['webpack', '5', 'Wp']] },
  ] },
  { owner: 'pmndrs', repo: 'zustand', lang: 'TypeScript', stars: '59k stars', layers: [
    { k: 'frontend', name: 'Frontend', more: 0, items: [['React', '19', 'Re']] },
    { k: 'backend', name: 'Backend', more: 0, items: [['Node', '', 'No']] },
    { k: 'infra', name: 'Infra', more: 0, items: [['GitHub Actions', '', 'Ga']] },
    { k: 'tooling', name: 'Tooling', more: 3, items: [['pnpm workspaces', '', 'Pn'], ['Vitest', '4', 'Vt'], ['TypeScript', '6', 'Ts'], ['esbuild', '0.28', 'Eb'], ['Rollup', '4', 'Ru'], ['ESLint', '9', 'El']] },
  ] },
  { owner: 'jwasham', repo: 'coding-interview-university', lang: '', stars: '362k stars', layers: [
    { k: 'infra', name: 'Infra', more: 0, items: [['GitHub Actions', '', 'Ga']] },
  ] },
];
const THEMES = [
  { page: '#ffffff', term: '#FAFAF7', ink: '#101615', muted: '#5A625E', rule: '#D8DCD4', accent: '#C8461E',
    layer: { frontend: ['#2458C4', '#E4ECFA'], backend: ['#1B7F52', '#E0F1E7'], infra: ['#9A5F0E', '#F5EAD6'], tooling: ['#596068', '#EAECED'] } },
  { page: '#0d1117', term: '#0A0D10', ink: '#DDE2DD', muted: '#8B9490', rule: '#2A3136', accent: '#FF6B3D',
    layer: { frontend: ['#7FAEFF', '#14223A'], backend: ['#5CC896', '#10291D'], infra: ['#E5AE58', '#2A2111'], tooling: ['#A8AEB5', '#1C2126'] } },
];
function card(t, r) {
  return {
    owner: r.owner, repo: r.repo, lang: r.lang, hasLang: !!r.lang, stars: r.stars,
    term: t.term, ink: t.ink, muted: t.muted, rule: t.rule, accent: t.accent,
    layers: r.layers.map((l, i) => ({
      glyph: i === r.layers.length - 1 ? '└──' : '├──', key: l.k, color: t.layer[l.k][0], muted: t.muted,
      hasMore: l.more > 0, more: '+' + l.more + ' more',
      items: l.items.map((it) => ({ n: it[0], v: it[1], hasV: !!it[1], ink: t.ink, muted: t.muted })),
    })),
  };
}
class Component extends DCLogic {
  renderVals() {
    return { sections: THEMES.map((t) => ({ bg: t.page, cards: REPOS.map((r) => card(t, r)) })) };
  }
}
</script>
</body>
</html>
